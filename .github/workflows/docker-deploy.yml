name: Docker Build & Deploy — Cloud HARTOS

# Triggers on push to develop, merge to main, or manual dispatch
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'tests/**'
      - '.github/workflows/nix-*'
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (staging/production)'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hartos
  DOCKER_BUILDKIT: 1

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Quick lint + import check ──────────────────────────────
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax check critical modules
        run: |
          python -c "
          import ast, sys
          files = [
              'hart_intelligence_entry.py', 'helper.py', 'agent_identity.py',
              'cultural_wisdom.py', 'hart_onboarding.py', 'create_recipe.py',
              'reuse_recipe.py', 'lifecycle_hooks.py',
          ]
          failed = []
          for f in files:
              try:
                  ast.parse(open(f).read())
              except Exception as e:
                  failed.append(f'{f}: {e}')
          if failed:
              print('SYNTAX ERRORS:')
              for f in failed: print(f'  {f}')
              sys.exit(1)
          print(f'All {len(files)} files OK')
          "

  # ── 2. Build Docker image ─────────────────────────────────────
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Verify image
        run: |
          docker pull ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker run --rm ${{ fromJSON(steps.meta.outputs.json).tags[0] }} python -c "
          from hart_intelligence_entry import app
          from agent_identity import build_identity_prompt
          from integrations.social import init_social
          print('All critical imports OK')
          "

  # ── 3. Deploy to cloud server ─────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged)
    timeout-minutes: 75
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Deploy to <deploy-host> (central instance)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          # docker build --no-cache on the 8GB langchain_gpt image
          # routinely runs 25-40 min; 60m gives headroom + the 30-step
          # health-check loop afterward.
          command_timeout: 60m
          script: |
            set -e
            # Canonical clone path on <deploy-host> — the repo dir
            # carries untracked release_manifest.json + .env + config.json
            # that the central image bake-in needs.  git pull --ff-only
            # leaves untracked files alone; aborts on local divergence.
            cd <deploy-repo-path>

            git pull --ff-only origin main

            # Mirror the host's manual deploy pattern (sathish has
            # NOPASSWD sudo for docker + the master-key file read).
            docker build --no-cache -t langchain_gpt:main .

            sudo docker stop langchain 2>/dev/null || true
            sudo docker rm   langchain 2>/dev/null || true
            sudo docker run -d --name langchain --restart unless-stopped \
              -p 6777:6777 \
              --env-file .env \
              -e HEVOLVE_MASTER_PRIVATE_KEY="$(sudo cat <master-key-path>)" \
              -v "$(pwd)/config.json:/app/config.json:ro" \
              -v "$(pwd)/release_manifest.json:/app/release_manifest.json:ro" \
              -v <deploy-logs-path>:/app/logs \
              -v <deploy-images-path>:/app/output_images \
              langchain_gpt:main

            # Health check — /status is the canonical liveness probe.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:6777/status >/dev/null 2>&1; then
                echo "[OK] HARTOS healthy on :6777"
                docker ps --filter name=langchain --format '  Status: {{.Status}}'
                exit 0
              fi
              sleep 3
            done
            echo "[FAIL] Health check timed out — dumping recent container logs"
            docker logs --tail 100 langchain || true
            exit 1
